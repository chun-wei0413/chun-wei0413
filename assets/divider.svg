<svg xmlns="http://www.w3.org/2000/svg" width="900" height="6" viewBox="0 0 900 6">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff41"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="6" fill="#000000"/>
  <rect y="2" width="900" height="2" fill="#0a3d1a"/>
  <rect y="1" width="300" height="4" fill="url(#g)">
    <animate attributeName="x" from="-300" to="900" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect y="1" width="300" height="4" fill="#ff0080" opacity="0.7">
    <animate attributeName="x" from="900" to="-300" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="3.6s" repeatCount="indefinite"/>
  </rect>
</svg>
